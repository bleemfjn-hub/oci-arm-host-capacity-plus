name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      - name: PHP syntax check
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run unit tests
        run: vendor/bin/phpunit --color tests/
        continue-on-error: true

  smoke:
    name: Smoke test (no fatal error)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate throwaway RSA key
        run: openssl genrsa -out /tmp/dummy_key.pem 2048 2>/dev/null

      - name: Create dummy .env
        run: |
          {
            echo 'OCI_REGION=ap-tokyo-1'
            echo 'OCI_USER_ID=ocid1.user.oc1..aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            echo 'OCI_TENANCY_ID=ocid1.tenancy.oc1..aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            echo 'OCI_KEY_FINGERPRINT=00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00'
            echo 'OCI_PRIVATE_KEY_FILENAME=/tmp/dummy_key.pem'
            echo 'OCI_SUBNET_ID=ocid1.subnet.oc1.ap-tokyo-1.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            echo 'OCI_IMAGE_ID=ocid1.image.oc1.ap-tokyo-1.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            echo 'OCI_OCPUS=1'
            echo 'OCI_MEMORY_IN_GBS=6'
            echo 'OCI_SHAPE=VM.Standard.A1.Flex'
            echo 'OCI_MAX_INSTANCES=1'
            echo 'OCI_SSH_PUBLIC_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA ci@test"'
            echo 'OCI_RESIZE_TARGET_OCPUS=2'
            echo 'OCI_RESIZE_TARGET_MEMORY_IN_GBS=12'
            echo 'TOO_MANY_REQUESTS_TIME_WAIT=600'
            echo 'CACHE_AVAILABILITY_DOMAINS=1'
          } > .env
          echo '--- .env ---'
          cat .env

      - name: Run index.php (expect graceful failure, not fatal)
        run: |
          set +e
          output=$(php index.php 2>&1)
          code=$?
          echo "$output"
          echo "exit_code=$code"
          # Parse errors and signing failures are real bugs.
          # API-level errors (NotAuthenticated / Out of host capacity) are expected with dummy credentials.
          if echo "$output" | grep -qE 'PHP Parse error'; then
            echo "::error::PHP parse error detected"
            exit 1
          fi
          if echo "$output" | grep -q 'SigningValidationFailedException'; then
            echo "::error::signature generation failed"
            exit 1
          fi
          echo "OK: no parse error, signature generated successfully"

      - name: Verify auto-resize code is present
        run: |
          grep -q 'OCI_RESIZE_TARGET_OCPUS' index.php
          grep -q 'updateInstanceShape' src/OciApi.php
          echo "OK: auto-resize code present"